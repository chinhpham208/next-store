name: Preview E2E

# Smoke + E2E against a Vercel deployment that is not Production (PR preview or Dev).
#
# deployment_status: GITHUB_SHA is the deployed commit and GitHub reads this file from that commit (the event has
# no default-branch requirement), so a PR that changes this file is tested by its own version.
# workflow_dispatch: manual run against a URL from the allowlist below, tests checked out from the dispatched ref.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'https://next-store-<…>-chinhpham208s-projects.vercel.app hoặc https://next-store-dev-ginpham.vercel.app'
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e-preview:
    # contains() is case-insensitive: excludes "Production" and "Production – next-store". Production E2E is out
    # of scope for this workflow (M2 Task 5).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       !contains(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # At job level, so the skipped runs for non-success statuses never enter the group. Not cancelling keeps a late
    # status from killing a run that is already testing.
    concurrency:
      group: preview-e2e-${{ github.event.deployment.id || inputs.base_url || github.ref }}
      cancel-in-progress: false
    steps:
      - name: deployment info
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_CREATOR: ${{ github.event.deployment_status.creator.login }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          INPUT_URL: ${{ inputs.base_url }}
        # Not secrets, but third-party strings: stop-commands keeps them from being read as workflow commands.
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'event=%s\nenvironment=%s\nenvironment_url=%s\nstate=%s\ncreator=%s\nstatus_creator=%s\nref=%s\nsha=%s\ninput_url=%s\n' \
            "$EVENT_NAME" "$DEPLOY_ENV" "$DEPLOY_URL" "$DEPLOY_STATE" "$DEPLOY_CREATOR" "$STATUS_CREATOR" "$DEPLOY_REF" "$DEPLOY_SHA" "$INPUT_URL"
          echo "::$token::"

      # Runs before anything touches the secret: the bypass header only ever goes to this project's deployments.
      - name: check URL
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_CREATOR: ${{ github.event.deployment_status.creator.login }}
          INPUT_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ "$EVENT_NAME" = deployment_status ]; then
            # Both: anyone with write access can add a status (and its environment_url) to Vercel's deployment.
            [ "$DEPLOY_CREATOR" = 'vercel[bot]' ] || fail "deployment không do vercel[bot] tạo; không chạy."
            [ "$STATUS_CREATOR" = 'vercel[bot]' ] || fail "deployment status không do vercel[bot] tạo; không chạy."
            url=$DEPLOY_URL
          else
            url=$INPUT_URL
          fi
          url=${url%/}
          preview_re='^https://next-store-[a-z0-9-]+-chinhpham208s-projects\.vercel\.app$'
          dev_re='^https://next-store-dev-ginpham\.vercel\.app$'
          # The rejected value is not printed: it is untrusted and could carry workflow commands.
          [[ $url =~ $preview_re || $url =~ $dev_re ]] ||
            fail "URL không thuộc preview của next-store (*-chinhpham208s-projects.vercel.app) hay Dev; không chạy."
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "BASE_URL=$url"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: smoke
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Owner decision 15 fallback (plan M3, NS-65): Dev has no X-Robots-Tag, so robots.txt must block crawling
          # on every deployment this job sees. Never Production: this job does not run there.
          SMOKE_ROBOTS: disallow
        run: npm run smoke

      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e
        id: e2e
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # A trace records request headers, the bypass header included, and the report below embeds traces.
        run: npm run e2e -- --trace off

      - name: upload Playwright report
        # Only a failed e2e has a report; a failed URL check or smoke has nothing to upload.
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 7
