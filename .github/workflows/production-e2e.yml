name: Production E2E

# Smoke + read-only E2E against Production after a release (M3 Task 17, owner decision 12).
#
# deployment_status: runs when Vercel reports a successful Production deployment; tests come from the deployed commit.
# workflow_dispatch: manual run after a release (docs/agents/qa.md); tests come from the `production` branch.
#
# The URL is fixed below, never taken from the event: only https://next-store-iota-silk.vercel.app is tested (the
# same origin as PRODUCTION_ORIGINS in e2e/production.ts — change both together). No secret, no DATABASE_URL, no
# `npm run build` (its prebuild runs db:setup), no db:* command: the job only sends HTTP requests to Production,
# and the fixtures of e2e/test.ts keep it read-only (README, "Sau release: workflow `Production E2E`").
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_URL: https://next-store-iota-silk.vercel.app

jobs:
  production-e2e:
    # The environment must be exactly Vercel's "Production" (contains() would also match a future Custom Environment
    # such as "pre-production"; == ignores case). Both the deployment and its status must come from Vercel: anyone
    # with write access can add a status to a deployment. Vercel sets deployment.ref to the commit SHA, not the branch
    # (deployment 7987168922 of v0.3.0, NS-78), so the `production` branch check is the "deployed commit is on
    # production" step below, not a condition here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]' &&
       github.event.deployment_status.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time against Production; a second release waits instead of cancelling a run that is testing.
    concurrency:
      group: production-e2e
      cancel-in-progress: false
    steps:
      - name: deployment info
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        # Not secrets, but third-party strings: stop-commands keeps them from being read as workflow commands.
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'event=%s\nenvironment=%s\nref=%s\nsha=%s\nbase_url=%s\n' \
            "$EVENT_NAME" "$DEPLOY_ENV" "$DEPLOY_REF" "$DEPLOY_SHA" "$PRODUCTION_URL"
          echo "::$token::"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || 'production' }}
          # Full history and every branch, for the ancestry check below.
          fetch-depth: 0
          persist-credentials: false

      # A preview promoted to Production, or `vercel --prod` from another branch, would otherwise run this workflow
      # and e2e/test.ts (the write guard) from an unreviewed commit.
      - name: deployed commit is on production
        if: github.event_name == 'deployment_status'
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          [[ $DEPLOY_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "deployment.sha không hợp lệ" >&2; exit 1; }
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/production ||
            { echo "commit đã deploy không nằm trên nhánh production: không chạy E2E" >&2; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: smoke
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          # Production must let crawlers in; left empty, smoke would also accept `Disallow: /` (review PR #42).
          SMOKE_ROBOTS: allow
          # On Vercel the proxy runs at the edge nearest the runner, far from Neon in Singapore, so a product slug
          # lookup can outlast its 400 ms bound and fail open (200). Here that is a warning with the time taken; slugs
          # that never reach the database must still 404. Preview leaves it unset and fails (NS-79, ADR-0009; fix: M5).
          SMOKE_PRODUCT_FAIL_OPEN: warn
        run: npm run smoke

      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: e2e
        id: e2e
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
          # Same flag as smoke, same rule (NS-79, NS-100): a well-formed unknown product slug answering 200 is a
          # `warning` annotation with the time taken (e2e/product-fail-open.ts); everything else must still 404.
          SMOKE_PRODUCT_FAIL_OPEN: warn
        run: npm run e2e

      - name: upload Playwright report
        # Only a failed e2e has a report; a failed smoke has nothing to upload.
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7
